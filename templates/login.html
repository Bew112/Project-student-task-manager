{% extends "auth_base.html" %}
{% block title %}Đăng nhập · StudySync{% endblock %}
{% block auth_content %}
<h1>Đăng nhập tài khoản</h1>
<p class="auth-subtitle">Chào mừng bạn quay lại! Hãy tiếp tục quản lý bài tập.</p>

<div class="social-row">
  <button class="social-button" type="button" disabled title="Đăng nhập Google chưa được cấu hình">
    <span class="google-g" aria-hidden="true">G</span> Google
  </button>
  <button class="social-button" type="button" disabled title="Đăng nhập Facebook chưa được cấu hình">
    <span class="facebook-f" aria-hidden="true">f</span> Facebook
  </button>
</div>

<div class="auth-divider"><span>hoặc đăng nhập bằng email</span></div>

<form method="post" class="auth-form">
  <label for="email">Email</label>
  <div class="input-wrap">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="m4 7 8 6 8-6"></path></svg>
    <input id="email" type="email" name="email" autocomplete="email" placeholder="name@example.com"
           value="{{ request.form.get('email', '') }}" required autofocus>
  </div>

  <label for="password">Mật khẩu</label>
  <div class="input-wrap">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10" width="14" height="11" rx="2"></rect><path d="M8 10V7a4 4 0 0 1 8 0v3"></path></svg>
    <input id="password" type="password" name="password" autocomplete="current-password"
           placeholder="Nhập mật khẩu" required>
    <button class="password-toggle" type="button" aria-label="Hiện mật khẩu" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"></path><circle cx="12" cy="12" r="3"></circle><path class="eye-slash" d="m4 4 16 16"></path></svg>
    </button>
  </div>

  <div class="form-options">
    <label class="remember-option"><input type="checkbox" name="remember"> <span>Ghi nhớ đăng nhập</span></label>
    <a href="{{ url_for('forgot_password') }}">Quên mật khẩu?</a>
  </div>

  <button class="submit-button" type="submit">Đăng nhập</button>
</form>

<p class="auth-switch">Bạn chưa có tài khoản? <a href="{{ url_for('register') }}">Tạo tài khoản</a></p>

<script>
  document.querySelector(".password-toggle").addEventListener("click", function () {
    const input = document.getElementById("password");
    const visible = input.type === "password";
    input.type = visible ? "text" : "password";
    this.setAttribute("aria-pressed", String(visible));
    this.setAttribute("aria-label", visible ? "Ẩn mật khẩu" : "Hiện mật khẩu");
  });
</script>
{% endblock %}
