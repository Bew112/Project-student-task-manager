{% extends "auth_base.html" %}
{% block title %}Tạo tài khoản · StudySync{% endblock %}
{% block auth_content %}
<h1>Tạo tài khoản</h1>
<p class="auth-subtitle">Đăng ký để bắt đầu sắp xếp bài tập của bạn.</p>

<form method="post" class="auth-form register-form">
  <label for="email">Email</label>
  <div class="input-wrap">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="m4 7 8 6 8-6"></path></svg>
    <input id="email" type="email" name="email" autocomplete="email" placeholder="name@example.com"
           value="{{ request.form.get('email', '') }}" required autofocus>
  </div>

  <label for="password">Mật khẩu</label>
  <div class="input-wrap">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10" width="14" height="11" rx="2"></rect><path d="M8 10V7a4 4 0 0 1 8 0v3"></path></svg>
    <input id="password" type="password" name="password" autocomplete="new-password"
           placeholder="Ít nhất 8 ký tự" minlength="8" required>
  </div>

  <label for="confirm-password">Xác nhận mật khẩu</label>
  <div class="input-wrap">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10" width="14" height="11" rx="2"></rect><path d="M8 10V7a4 4 0 0 1 8 0v3"></path></svg>
    <input id="confirm-password" type="password" name="confirm_password" autocomplete="new-password"
           placeholder="Nhập lại mật khẩu" required>
  </div>

  <button class="submit-button" type="submit">Tạo tài khoản</button>
</form>

<p class="auth-switch">Đã có tài khoản? <a href="{{ url_for('login') }}">Đăng nhập</a></p>
{% endblock %}
